name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: System packages
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-color-emoji
      - name: Python packages
        # the nvidia-* wheels are only needed for GPU transcription; skip ~1 GB of downloads on a CPU runner
        run: |
          grep -v '^nvidia-' requirements.txt > /tmp/requirements-ci.txt
          python -m pip install -r /tmp/requirements-ci.txt -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
