name: windows app

on:
  push:
    branches: [main, windows-app]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write      # attach the installer and zip to the release for version tags
    timeout-minutes: 100
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLIPPY_NO_UPDATES: "1"     # the app's own yt-dlp update; smoke.py tests it directly
      CLIPPY_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('0.3.2-dev.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: The version is the same everywhere (and on version tags, the tag's)
        shell: pwsh
        run: |
          $v = (Select-String -Path clippy/version.py -Pattern 'VERSION = "(.+)"').Matches[0].Groups[1].Value
          if (-not (Select-String -Path packaging/windows/launcher.rc -SimpleMatch ('"ProductVersion", "' + $v + '"'))) {
            throw "packaging/windows/launcher.rc doesn't say ${v}, so Clippy.exe would show the wrong version"
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and "v$v" -ne $env:GITHUB_REF_NAME) {
            throw "clippy/version.py says $v but the tag is ${env:GITHUB_REF_NAME}, so the app would tell people the wrong version"
          }
          "Version $v everywhere"
      - name: Build, smoke-test and package
        shell: pwsh
        run: ./packaging/windows/build.ps1 -SmokeTest
      - name: Install, open and uninstall it like a user would
        shell: pwsh
        run: |
          function Wait-Clippy($dir, $seconds = 180) {
            foreach ($i in 1..($seconds / 2)) {
              $port = Get-Content "$dir\data\port.txt" -ErrorAction SilentlyContinue
              if ($port) { try { $s = Invoke-RestMethod "http://127.0.0.1:$port/api/status" -TimeoutSec 2; if ($s.folder -eq $dir) { return [int]$port } } catch {} }
              Start-Sleep 2
            }
            Get-Content "$dir\data\clippy.log" -ErrorAction SilentlyContinue
            throw "Clippy didn't start from $dir"
          }
          function Clippy-Processes($dir) {
            Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*$dir*" -and $_.Name -notlike "unins*" }
          }
          $setup = (Get-ChildItem dist\Clippy-Setup-*.exe).FullName
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          $dir = "$env:LOCALAPPDATA\Programs\Clippy"
          if (-not (Test-Path "$dir\Clippy.exe")) { throw "The installer didn't put Clippy in $dir" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Clippy.lnk")) { throw "No Start menu shortcut" }
          $busy = $true
          try { Invoke-RestMethod http://127.0.0.1:7860/api/status -TimeoutSec 2 | Out-Null } catch { $busy = $false }
          if ($busy) { throw "Something from the build is still running on port 7860" }

          "--- Another program already uses port 7860: Clippy must pick another one"
          $other = Start-Process python -ArgumentList "-m", "http.server", "7860", "--bind", "127.0.0.1" -PassThru -WindowStyle Hidden
          Start-Sleep 3
          Start-Process "$dir\Clippy.exe"
          $port = Wait-Clippy $dir
          if ($port -eq 7860) { throw "Clippy says it runs on 7860, which another program has" }
          $s = Invoke-RestMethod "http://127.0.0.1:$port/api/setup"
          "Clippy.exe started the app on port $port; its folder: $($s.folder); still needs: $($s.missing -join ', ')"
          if ($s.folder -ne $dir) { throw "The app isn't using its own folder" }

          "--- Extensions: the community list comes with the app, and installing one works"
          $cat = Invoke-RestMethod "http://127.0.0.1:$port/api/extensions/catalog"
          "Community list ($($cat.source)): $(($cat.items | ForEach-Object { $_.id }) -join ', ')"
          if ($cat.items.Count -lt 1) { throw "The community list is empty" }
          $x = Invoke-RestMethod -Method Post "http://127.0.0.1:$port/api/extensions/install" -ContentType "application/json" -Body '{"id": "extra-caption-styles"}'
          if (-not $x.enabled) { throw "Installing an extension didn't switch it on" }
          $styles = (Invoke-RestMethod "http://127.0.0.1:$port/api/styles") | ForEach-Object { $_.id }
          if ($styles -notcontains "pop") { throw "The extension's caption style isn't offered: $($styles -join ', ')" }
          if (-not (Test-Path "$dir\extensions\extra-caption-styles\extension.json")) { throw "The extension isn't in the app's folder" }
          "Installed an extension into $dir\extensions; its caption styles are offered"

          "--- Starting Clippy.exe again only opens the window"
          Start-Process "$dir\Clippy.exe"
          Start-Sleep 15
          $servers = @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -eq "$dir\python\pythonw.exe" })
          if ($servers.Count -ne 1) { $servers | Format-Table ProcessId, CommandLine; throw "Expected one Clippy, found $($servers.Count)" }
          if (Test-Path "$dir\data\window") { "App window profile lives inside the app folder: $dir\data\window" }

          "--- Start at login"
          $auto = Invoke-RestMethod -Method Post "http://127.0.0.1:$port/api/autostart" -ContentType "application/json" -Body '{"enabled": true}'
          if (-not $auto.enabled) { throw "Start at login didn't turn on: $($auto | ConvertTo-Json -Compress)" }
          $run = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run").Clippy
          if ($run -ne "`"$dir\Clippy.exe`" --background") { throw "Unexpected Run entry: $run" }
          "Run entry: $run"
          Clippy-Processes $dir | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Stop-Process -Id $other.Id -Force
          Start-Sleep 3
          Start-Process "$dir\Clippy.exe" -ArgumentList "--background"      # what Windows runs at login
          $port = Wait-Clippy $dir
          Start-Sleep 5
          if (Get-CimInstance Win32_Process | Where-Object { $_.Name -eq "msedge.exe" -and $_.CommandLine -like "*$dir*" }) { throw "--background opened a window" }
          "Started in the background on port $port, no window"

          "--- Notifications"
          Push-Location $dir
          & "$dir\python\python.exe" -X utf8 -c "from clippy import notify; app = notify.windows_app_id(); r = notify.windows_toast('Clippy', '3 new shorts are waiting for your review', app); print('app id:', app, '| exit code:', r.returncode, r.stderr.strip()[:300]); raise SystemExit(r.returncode)"
          if ($LASTEXITCODE) { throw "The notification failed" }
          Pop-Location

          "--- Uninstall while Clippy runs in the background"
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          foreach ($i in 1..20) { if (-not (Test-Path $dir)) { break }; Start-Sleep 1 }
          if (Test-Path $dir) { Get-ChildItem -Recurse $dir | Select-Object -First 20 FullName; throw "Uninstalling left files behind" }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Clippy.lnk") { throw "Uninstalling left the Start menu shortcut" }
          if ((Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run").Clippy) { throw "Uninstalling left the Start at login entry" }
          if (Clippy-Processes $dir) { throw "Clippy is still running after uninstalling" }
          "Installed, opened and uninstalled: nothing left behind"
      - name: Update from inside the app
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\Clippy-Setup-*.exe).FullName
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          $dir = "$env:LOCALAPPDATA\Programs\Clippy"
          $py = "$dir\python\pythonw.exe"
          # a pretend newer release (9.9.9): this same installer, served from this machine
          $feed = Join-Path $env:RUNNER_TEMP "feed"
          New-Item -ItemType Directory -Force $feed | Out-Null
          Copy-Item $setup "$feed\setup.exe"
          & "$dir\python\python.exe" -X utf8 -c "import sys; sys.path.insert(0, r'$dir'); from pathlib import Path; from clippy import updates; d = Path(r'$feed'); updates.feed_for_test(d / 'feed.json', '9.9.9', d / 'setup.exe', 'http://127.0.0.1:8765/setup.exe')"
          $web = Start-Process python -ArgumentList "-m", "http.server", "8765", "--bind", "127.0.0.1", "--directory", $feed -PassThru -WindowStyle Hidden
          $env:CLIPPY_UPDATE_FEED = "http://127.0.0.1:8765/feed.json"
          function Wait-Clippy($seconds) {
            foreach ($i in 1..($seconds / 2)) {
              $port = Get-Content "$dir\data\port.txt" -ErrorAction SilentlyContinue
              if ($port) { try { if ((Invoke-RestMethod "http://127.0.0.1:$port/api/status" -TimeoutSec 2).folder -eq $dir) { return [int]$port } } catch {} }
              Start-Sleep 2
            }
            Get-Content "$dir\data\clippy.log" -ErrorAction SilentlyContinue
            throw "Clippy didn't start from $dir"
          }
          Start-Sleep 3
          Start-Process "$dir\Clippy.exe"
          $port = Wait-Clippy 180
          $u = Invoke-RestMethod "http://127.0.0.1:$port/api/update?force=true"
          "Clippy $($u.current) sees $($u.latest): newer $($u.newer), can install $($u.can_install), local $($u.local)"
          if (-not ($u.newer -and $u.can_install -and $u.local)) { throw "The app doesn't offer the update: $($u | ConvertTo-Json -Compress)" }
          # Review on a phone: the limited server opens on the network, wants the QR key, and closes again
          $ph = Invoke-RestMethod -Method Post "http://127.0.0.1:$port/api/phone" -ContentType "application/json" -Body '{"on": true}'
          if (-not $ph.on) { throw "Phone review didn't turn on: $($ph | ConvertTo-Json -Compress)" }
          if ($ph.address) {
            $no = Invoke-WebRequest "$($ph.address)/api/review" -SkipHttpErrorCheck
            if ($no.StatusCode -ne 401) { throw "Phone review answered without the key ($($no.StatusCode))" }
            $phoneSession = New-Object Microsoft.PowerShell.Commands.WebRequestSession
            Invoke-WebRequest $ph.url -WebSession $phoneSession | Out-Null
            Invoke-RestMethod "$($ph.address)/api/review" -WebSession $phoneSession | Out-Null
            "Phone review works at $($ph.address) with the QR key, and refuses requests without it"
          } else { "No network address on this machine: phone review skipped" }
          Invoke-RestMethod -Method Post "http://127.0.0.1:$port/api/phone" -ContentType "application/json" -Body '{"on": false}' | Out-Null
          Invoke-RestMethod -Method Post "http://127.0.0.1:$port/api/settings" -ContentType "application/json" -Body '{"clips": 9}' | Out-Null
          $before = @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -eq $py } | ForEach-Object { $_.ProcessId })
          Invoke-RestMethod -Method Post "http://127.0.0.1:$port/api/update/install" | Out-Null
          "Update started; waiting for Clippy to close, update and open again"
          $back = $false
          foreach ($i in 1..150) {
            Start-Sleep 2
            $now = @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -eq $py } | ForEach-Object { $_.ProcessId })
            if ($now.Count -and -not ($now | Where-Object { $before -contains $_ })) {
              try { Invoke-RestMethod "http://127.0.0.1:$port/api/status" -TimeoutSec 2 | Out-Null; $back = $true; break } catch {}
            }
          }
          if (-not $back) { Get-Content "$dir\data\clippy.log" -Tail 40 -ErrorAction SilentlyContinue; throw "Clippy didn't come back after updating itself" }
          if ((Invoke-RestMethod "http://127.0.0.1:$port/api/settings").clips -ne 9) { throw "The update lost the settings" }
          if (-not (Test-Path "$dir\downloads\Clippy-Setup-9.9.9-win64.exe")) { throw "The update's installer isn't in Clippy's folder" }
          "Updated from inside the app: Clippy closed, updated and opened again with its settings"
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*$dir*" -and $_.Name -notlike "unins*" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Stop-Process -Id $web.Id -Force
          Start-Sleep 3
          # uninstalling keeps the shorts in Windows' own Videos folder, here moved to another drive (as OneDrive or a
          # second disk does), so they have to be copied across rather than renamed
          New-Item -ItemType Directory -Force "$dir\output\abc123\clips" | Out-Null
          Set-Content "$dir\output\abc123\clips\01-hook.mp4" "a short"
          $shell = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders"
          $oldVideos = (Get-ItemProperty $shell)."My Video"
          $videos = "D:\Videos elsewhere"
          New-Item -ItemType Directory -Force $videos | Out-Null
          Set-ItemProperty $shell -Name "My Video" -Value $videos
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/KEEPSHORTS=1" -Wait
          foreach ($i in 1..30) { if (-not (Test-Path $dir)) { break }; Start-Sleep 1 }
          Set-ItemProperty $shell -Name "My Video" -Value $oldVideos -Type ExpandString
          if (Test-Path $dir) { throw "Uninstalling after the update test left files behind" }
          $kept = Get-ChildItem "$videos\Clippy\shorts-*\abc123\clips\01-hook.mp4" -ErrorAction SilentlyContinue
          if (-not $kept) { Get-ChildItem -Recurse $videos -ErrorAction SilentlyContinue | Select-Object FullName; throw "The uninstaller didn't keep the shorts in the Videos folder on D:" }
          "Kept the shorts in the moved Videos folder: $($kept.FullName)"
      - name: Update over the previous release, in a folder with non-English letters
        shell: pwsh
        run: |
          $prev = gh release list --repo $env:GITHUB_REPOSITORY --exclude-drafts --exclude-pre-releases --limit 5 --json tagName --jq '.[].tagName' |
                  Where-Object { $_ -ne $env:GITHUB_REF_NAME } | Select-Object -First 1
          if (-not $prev) { "No earlier release to update from"; exit 0 }
          gh release download $prev --repo $env:GITHUB_REPOSITORY --pattern "Clippy-Setup-*.exe" --dir prev
          $old = (Get-ChildItem prev\Clippy-Setup-*.exe).FullName
          $dir = Join-Path $env:LOCALAPPDATA ("Programs\Clippy J" + [char]0x00F6 + "rg " + [char]0x6D4B + [char]0x8BD5)
          "Installing $prev into $dir"
          Start-Process $old -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`"" -Wait
          if (-not (Test-Path "$dir\Clippy.exe")) { throw "$prev didn't install into $dir" }

          # what a person has after using Clippy for a while: downloaded tools and models, settings, shorts
          $mine = @{
            "settings.json" = '{"clips": 7, "caption_style": "box", "whisper_model": "medium"}'
            "models\llm\My-Own-Model.gguf" = "model " * 1000
            "models\whisper\models--Systran--faster-whisper-medium\snapshots\abc\model.bin" = "whisper " * 1000
            "bin\ffmpeg.exe" = "ffmpeg"
            "engine\current.txt" = "b1-cpu"
            "engine\b1-cpu\llama-server.exe" = "engine"
            "fonts\NotoColorEmoji.ttf" = "emoji font"
            "output\local-jorg\clips\01-the-hook.mp4" = "video " * 1000
            "output\local-jorg\result.json" = '{"id": "local-jorg", "title": "J\u00f6rg\u2019s caf\u00e9 \ud83c\udfac", "created": 1, "clips": [{"file": "local-jorg/clips/01-the-hook.mp4", "title": "The hook"}]}'
            "output\_auto\review.json" = '[]'
          }
          foreach ($f in $mine.Keys) { $p = Join-Path $dir $f; New-Item -ItemType Directory -Force (Split-Path $p) | Out-Null; Set-Content -LiteralPath $p $mine[$f] -NoNewline }
          $before = @{}; foreach ($f in $mine.Keys) { $before[$f] = (Get-FileHash -LiteralPath (Join-Path $dir $f)).Hash }

          Start-Process "$dir\Clippy.exe"            # updating while the old Clippy is open
          $up = $false
          foreach ($i in 1..45) { try { Invoke-RestMethod http://127.0.0.1:7860/api/status -TimeoutSec 2 | Out-Null; $up = $true; break } catch { Start-Sleep 2 } }
          "The old Clippy is running: $up"

          $new = (Get-ChildItem dist\Clippy-Setup-*.exe).FullName
          Start-Process $new -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait     # no /DIR: it must find the old folder
          if (-not (Test-Path "$dir\clippy\notify.py")) { throw "The update didn't replace Clippy's files in $dir" }
          foreach ($f in $mine.Keys) {
            $p = Join-Path $dir $f
            if (-not (Test-Path -LiteralPath $p)) { throw "The update deleted $f" }
            if ((Get-FileHash -LiteralPath $p).Hash -ne $before[$f]) { throw "The update changed $f" }
          }
          "All downloads, settings and shorts survived the update"

          Start-Process "$dir\Clippy.exe"
          $port = $null
          foreach ($i in 1..90) {
            $port = Get-Content "$dir\data\port.txt" -ErrorAction SilentlyContinue
            if ($port) { try { if ((Invoke-RestMethod "http://127.0.0.1:$port/api/status" -TimeoutSec 2).folder -eq $dir) { break } } catch {} }
            $port = $null; Start-Sleep 2
          }
          if (-not $port) { Get-Content "$dir\data\clippy.log" -ErrorAction SilentlyContinue; throw "The updated Clippy didn't start from $dir" }
          $settings = Invoke-RestMethod "http://127.0.0.1:$port/api/settings"
          if ($settings.clips -ne 7 -or $settings.caption_style -ne "box") { throw "The updated Clippy lost the settings" }
          $lib = Invoke-RestMethod "http://127.0.0.1:$port/api/library"
          if (-not ($lib | Where-Object { $_.id -eq "local-jorg" })) { throw "The updated Clippy doesn't show the earlier shorts" }
          $models = (Invoke-RestMethod "http://127.0.0.1:$port/api/setup").models
          if (-not ($models | Where-Object { $_.file -eq "My-Own-Model.gguf" -and $_.installed })) { throw "The updated Clippy doesn't see the downloaded model" }
          "The updated Clippy runs from $dir with the earlier settings, shorts and model"

          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          foreach ($i in 1..20) { if (-not (Test-Path $dir)) { break }; Start-Sleep 1 }
          if (Test-Path $dir) { Get-ChildItem -Recurse $dir | Select-Object -First 20 FullName; throw "Uninstalling left files behind" }
          "Updated and uninstalled: nothing left behind"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: smoke-test-clip-${{ env.CLIPPY_VERSION }}
          path: |
            dist/smoke/
            dist/server.log*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v5
        with:
          name: Clippy-windows-${{ env.CLIPPY_VERSION }}
          path: |
            dist/Clippy-Setup-*.exe
            dist/Clippy-portable-*.zip
      - name: Attach to the GitHub release (version tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Clippy-Setup-*.exe
            dist/Clippy-portable-*.zip
