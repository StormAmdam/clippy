name: windows app

on:
  push:
    branches: [main, windows-app]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLIPPY_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('0.1.0-dev.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build, smoke-test and package
        shell: pwsh
        run: ./packaging/windows/build.ps1 -SmokeTest
      - uses: actions/upload-artifact@v4
        with:
          name: Clippy-windows-${{ env.CLIPPY_VERSION }}
          path: |
            dist/Clippy-Setup-*.exe
            dist/Clippy-portable-*.zip
      - name: Attach to the GitHub release (version tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Clippy-Setup-*.exe
            dist/Clippy-portable-*.zip
